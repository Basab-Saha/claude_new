<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Game Recommendations</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <div id="auth-bar" class="auth-bar"></div>

    <header>
      <h1>Recommended For You</h1>
      <p class="subtitle">Picked from what's popular on Steam right now, based on your own library</p>
    </header>

    <div id="signed-out" class="signed-out" hidden>
      <p>Sign in with Steam to see game recommendations based on your library.</p>
      <a class="steam-login" href="/auth/steam">Sign in through Steam</a>
    </div>

    <section id="recs-section" hidden>
      <p id="recs-subtitle" class="subtitle"></p>
      <div id="recs-status"></div>
      <ol id="recs-list" class="game-list"></ol>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
