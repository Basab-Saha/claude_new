<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Top 10 - Current Players</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <div id="auth-bar" class="auth-bar"></div>

    <header>
      <h1>Top 10 Steam Games</h1>
      <p class="subtitle">Ranked by current concurrent players</p>
      <div class="controls">
        <button id="refresh-btn">Refresh</button>
        <span id="updated-at"></span>
      </div>
    </header>

    <div id="status"></div>
    <ol id="game-list" class="game-list"></ol>

    <section id="recs-section" class="recs-section" hidden>
      <header class="recs-header">
        <h2>Recommended For You</h2>
        <p id="recs-subtitle" class="subtitle"></p>
      </header>
      <div id="recs-status"></div>
      <ol id="recs-list" class="game-list"></ol>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
